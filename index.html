<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napoléon Bonaparte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#0a0908;
    font-family:'Inter',sans-serif;
    color:#e8e2d4;
    min-height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ============ BACKGROUND: AUTO-SOLVING RUBIK ============ */
  .bg-scene {
    position:fixed;
    inset:0;
    z-index:0;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1400px;
    opacity:.55;
    pointer-events:none;
  }

  .rubik {
    width:280px;
    height:280px;
    position:relative;
    transform-style:preserve-3d;
    animation:rubikSpin 22s linear infinite;
  }

  @keyframes rubikSpin {
    0%   { transform:rotateX(-22deg) rotateY(0deg)   rotateZ(0deg); }
    100% { transform:rotateX(-22deg) rotateY(360deg) rotateZ(360deg); }
  }

  .cube {
    position:absolute;
    width:100%; height:100%;
    transform-style:preserve-3d;
  }

  .face {
    position:absolute;
    width:280px; height:280px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:6px;
    padding:6px;
    background:rgba(10,9,8,.6);
    border:1px solid rgba(185,159,119,.15);
    border-radius:14px;
    backface-visibility:hidden;
  }

  .tile {
    border-radius:5px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.08);
    animation:tileGlow 6s ease-in-out infinite alternate;
  }

  @keyframes tileGlow {
    0%   { filter:brightness(.75); }
    100% { filter:brightness(1.15); }
  }

  /* 6 faces of the 3D cube */
  .f-front  { transform:translateZ(140px); }
  .f-back   { transform:rotateY(180deg) translateZ(140px); }
  .f-right  { transform:rotateY(90deg)  translateZ(140px); }
  .f-left   { transform:rotateY(-90deg) translateZ(140px); }
  .f-top    { transform:rotateX(90deg)  translateZ(140px); }
  .f-bottom { transform:rotateX(-90deg) translateZ(140px); }

  /* palette per face (muted luxury tones) */
  .f-front  .tile { background:linear-gradient(135deg,#b99f77,#8a7554); }
  .f-back   .tile { background:linear-gradient(135deg,#6b7d8c,#4a5a66); }
  .f-right  .tile { background:linear-gradient(135deg,#9c6b5e,#6e4a40); }
  .f-left   .tile { background:linear-gradient(135deg,#7a8a6b,#55634a); }
  .f-top    .tile { background:linear-gradient(135deg,#c8b28b,#9a8764); }
  .f-bottom .tile { background:linear-gradient(135deg,#5e6a7a,#3e4753); }

  /* staggered glow */
  .f-front  .tile:nth-child(3n+1) { animation-delay:0s; }
  .f-front  .tile:nth-child(3n+2) { animation-delay:.5s; }
  .f-front  .tile:nth-child(3n)   { animation-delay:1s; }
  .f-back   .tile:nth-child(3n+1) { animation-delay:1.5s; }
  .f-back   .tile:nth-child(3n+2) { animation-delay:2s; }
  .f-back   .tile:nth-child(3n)   { animation-delay:2.5s; }
  .f-right  .tile:nth-child(3n+1) { animation-delay:3s; }
  .f-right  .tile:nth-child(3n+2) { animation-delay:3.5s; }
  .f-right  .tile:nth-child(3n)   { animation-delay:4s; }
  .f-left   .tile:nth-child(3n+1) { animation-delay:4.5s; }
  .f-left   .tile:nth-child(3n+2) { animation-delay:5s; }
  .f-left   .tile:nth-child(3n)   { animation-delay:5.5s; }

  /* ============ LOADER ============ */
  .loader {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:1.6rem;
    background:#0a0908;
    z-index:9999;
    transition:opacity .7s ease;
  }
  .loader.fade { opacity:0; pointer-events:none; }
  .loader-ring {
    width:52px; height:52px; border-radius:50%;
    border:2px solid rgba(185,159,119,.15);
    border-top:2px solid #c8b28b;
    animation:spin 1s linear infinite;
  }
  .loader-text {
    font-family:'Cormorant Garamond',serif;
    font-size:1.1rem; letter-spacing:6px;
    text-transform:uppercase; color:#c8b28b;
    animation:pulseSoft 1.8s infinite alternate;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulseSoft {
    from { opacity:.45; letter-spacing:5px; }
    to   { opacity:1; letter-spacing:7px; }
  }

  /* ============ MAIN UI ============ */
  .app {
    position:relative;
    z-index:2;
    width:100%;
    max-width:1100px;
    padding:2rem 1.2rem 4rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    animation:appIn 1s ease 1.6s forwards;
  }
  @keyframes appIn {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .header { text-align:center; margin-bottom:2.4rem; }
  .header h1 {
    font-family:'Cormorant Garamond',serif;
    font-size:2.6rem; font-weight:700;
    letter-spacing:1px; color:#dac29a;
    line-height:1.1; text-shadow:0 4px 20px rgba(0,0,0,.8);
  }
  .header p {
    font-size:.72rem; letter-spacing:5px;
    text-transform:uppercase; color:#9c8e7a;
    margin-top:.6rem;
  }

  /* ============ INFINITE CAROUSEL ============ */
  .carousel {
    width:100%;
    overflow:hidden;
    position:relative;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
    padding:1rem 0;
  }

  .carousel-track {
    display:flex;
    gap:1.2rem;
    width:max-content;
    animation:scrollLeft 40s linear infinite;
    will-change:transform;
  }
  .carousel:hover .carousel-track {
    animation-play-state:paused;
  }

  @keyframes scrollLeft {
    from { transform:translateX(0); }
    to   { transform:translateX(-50%); }
  }

  .box {
    flex:0 0 260px;
    background:linear-gradient(160deg,#1a1816 0%,#23201c 100%);
    border:1px solid #3b352c;
    border-radius:18px;
    padding:1.5rem 1.4rem;
    position:relative;
    overflow:hidden;
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.7);
  }
  .box::before {
    content:'';
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,#b99f77,transparent);
    opacity:.5;
  }
  .box:hover {
    transform:translateY(-6px);
    border-color:#b99f77;
    box-shadow:0 20px 40px -12px rgba(185,159,119,.25);
  }

  .box-icon {
    font-size:1.6rem;
    margin-bottom:.8rem;
    display:block;
    filter:drop-shadow(0 0 8px rgba(185,159,119,.4));
  }
  .box-label {
    font-size:.62rem; letter-spacing:2.5px;
    text-transform:uppercase; color:#9c8e7a;
    font-weight:600; display:block; margin-bottom:.5rem;
  }
  .box-value {
    font-family:'Cormorant Garamond',serif;
    font-size:1.35rem; font-weight:600;
    color:#e8dcc4; line-height:1.25;
  }
  .box-desc {
    font-size:.8rem; line-height:1.5;
    color:#a89b88; margin-top:.6rem;
  }

  /* second slower row (reverse direction) */
  .carousel.reverse .carousel-track {
    animation:scrollRight 55s linear infinite;
  }
  @keyframes scrollRight {
    from { transform:translateX(-50%); }
    to   { transform:translateX(0); }
  }

  /* ============ FOOTER ============ */
  .bruckle-footer {
    position:fixed; bottom:0; left:0;
    width:100%; text-align:center;
    font-size:.55rem; letter-spacing:3px;
    color:#4b4137; text-transform:uppercase;
    padding:.4rem 0 .6rem;
    font-weight:300; opacity:.4;
    z-index:300; pointer-events:none;
  }

  @media (max-width:600px) {
    .header h1 { font-size:1.9rem; }
    .header p { font-size:.62rem; letter-spacing:3px; }
    .box { flex:0 0 210px; padding:1.2rem 1.1rem; }
    .box-value { font-size:1.15rem; }
    .rubik { width:180px; height:180px; }
    .face { width:180px; height:180px; }
    .f-front  { transform:translateZ(90px); }
    .f-back   { transform:rotateY(180deg) translateZ(90px); }
    .f-right  { transform:rotateY(90deg)  translateZ(90px); }
    .f-left   { transform:rotateY(-90deg) translateZ(90px); }
    .f-top    { transform:rotateX(90deg)  translateZ(90px); }
    .f-bottom { transform:rotateX(-90deg) translateZ(90px); }
    .app { padding:1.5rem .6rem 3rem; }
  }
</style>
</head>
<body>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">LOADING</div>
</div>

<!-- AUTO-SOLVING RUBIK BACKGROUND -->
<div class="bg-scene">
  <div class="rubik">
    <div class="cube">
      <div class="face f-front">
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      </div>
      <div class="face f-back">
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      </div>
      <div class="face f-right">
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      </div>
      <div class="face f-left">
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      </div>
      <div class="face f-top">
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      </div>
      <div class="face f-bottom">
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="app">
  <div class="header">
    <h1>Napoléon Bonaparte</h1>
    <p>Emperor · General · Legend</p>
  </div>

  <!-- ROW 1: scrolls left -->
  <div class="carousel">
    <div class="carousel-track" id="track1">
      <!-- set will be duplicated by JS -->
    </div>
  </div>

  <!-- ROW 2: scrolls right (slower) -->
  <div class="carousel reverse">
    <div class="carousel-track" id="track2">
      <!-- set will be duplicated by JS -->
    </div>
  </div>

  <!-- ROW 3: scrolls left -->
  <div class="carousel">
    <div class="carousel-track" id="track3">
      <!-- set will be duplicated by JS -->
    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="bruckle-footer">BRUCKLE</div>

<script>
(function() {
  // ---- Data for the info boxes ----
  const row1 = [
    { icon:'🎂', label:'Born',     value:'15 Aug 1769',        desc:'Ajaccio, Corsica — into minor Italian nobility.' },
    { icon:'⚰️', label:'Died',     value:'5 May 1821',         desc:'Saint Helena, South Atlantic — likely stomach cancer.' },
    { icon:'👑', label:'Reign',    value:'1804 – 1815',        desc:'Emperor of the French; the First French Empire.' },
    { icon:'⚔️', label:'Titles',   value:'Emperor & General',  desc:'First Consul, Emperor, King of Italy.' },
    { icon:'📜', label:'Code',     value:'Napoleonic Code',    desc:'Civil law reform still used in 70+ countries.' },
    { icon:'🏛️', label:'Legacy',   value:'Modern Europe',      desc:'Reshaped borders, law, and warfare forever.' }
  ];

  const row2 = [
    { icon:'🇫🇷', label:'Nation',   value:'France',            desc:'Rose from revolution to rule an empire.' },
    { icon:'🏰', label:'Capital',  value:'Paris',              desc:'Crowned himself at Notre-Dame in 1804.' },
    { icon:'🎓', label:'Education', value:'École Militaire',   desc:'Graduated as an artillery lieutenant at 16.' },
    { icon:'💍', label:'Spouse',   value:'Joséphine → Marie-Louise', desc:'Two marriages; one heir, Napoleon II.' },
    { icon:'🗺️', label:'Empire',   value:'Most of Europe',     desc:'At its peak, controlled or allied with 12+ nations.' },
    { icon:'📖', label:'Famous Quote', value:'“Impossible…”',  desc:'“…is a word found only in the dictionary of fools.”' }
  ];

  const row3 = [
    { icon:'🔥', label:'Austerlitz', value:'1805',             desc:'The “Battle of the Three Emperors” — a masterpiece.' },
    { icon:'❄️', label:'Russia',     value:'1812',             desc:'Invasion cost the Grande Armée 500,000+ men.' },
    { icon:'🌊', label:'Waterloo',   value:'18 June 1815',     desc:'Final defeat by Wellington and Blücher.' },
    { icon:'🏝️', label:'Elba',       value:'1814',             desc:'First exile — he escaped in 100 days.' },
    { icon:'🗿', label:'Memorial',   value:'Les Invalides',    desc:'Remains returned to Paris in 1840.' },
    { icon:'⭐', label:'Rank',        value:'Greatest Tactician', desc:'Studied in military academies worldwide.' }
  ];

  // ---- Render a box ----
  function makeBox(item) {
    const div = document.createElement('div');
    div.className = 'box';
    div.innerHTML = `
      <span class="box-icon">${item.icon}</span>
      <span class="box-label">${item.label}</span>
      <div class="box-value">${item.value}</div>
      <div class="box-desc">${item.desc}</div>
    `;
    return div;
  }

  // ---- Fill tracks with data, then duplicate for seamless loop ----
  function populate(trackId, data) {
    const track = document.getElementById(trackId);
    // first set
    data.forEach(item => track.appendChild(makeBox(item)));
    // duplicate set (required for -50% loop)
    data.forEach(item => track.appendChild(makeBox(item)));
  }

  populate('track1', row1);
  populate('track2', row2);
  populate('track3', row3);

  // ---- Loader fade ----
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loader').classList.add('fade');
    }, 1600);
  });
  // fallback
  setTimeout(() => {
    const l = document.getElementById('loader');
    if (l && !l.classList.contains('fade')) l.classList.add('fade');
  }, 3200);
})();
</script>
</body>
</html>
